name: Flutter CI

on:
  push:
    branches:
      - main
      - master
      - '**/feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'

      - name: Enable Flutter web
        run: flutter channel stable && flutter config --enable-web

      - name: Fetch dependencies
        run: flutter pub get

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Run Dart unit/widget tests
        run: flutter test --machine > test_results.json || true

      - name: Build Flutter web
        run: flutter build web --release

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Generate test summary and Excel report
        run: node scripts/generate-report.js test_results.json artifacts/test-report.xlsx

      - name: Upload Excel report artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: artifacts/test-report.xlsx

      - name: Add test summary to job summary
        run: |
          cat artifacts/summary.md >> $GITHUB_STEP_SUMMARY

  selenium:
    name: Selenium E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'

      - name: Enable Flutter web
        run: flutter channel stable && flutter config --enable-web

      - name: Fetch dependencies
        run: flutter pub get

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Build Flutter web
        run: flutter build web --release

      - name: Setup Chrome and Chromedriver
        uses: nanasess/setup-chromedriver@v1
        with:
          chrome-version: latest

      - name: Start web server
        run: npx http-server build/web -p 8080 &

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Run Selenium E2E tests
        run: node scripts/selenium-e2e.js

      - name: Upload Selenium report artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: artifacts/selenium-report.xlsx

  api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'

      - name: Enable Flutter web
        run: flutter channel stable && flutter config --enable-web

      - name: Fetch dependencies
        run: flutter pub get

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Run API tests
        run: flutter test test/gemini_service_test.dart --machine > api_test_results.json || true

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Generate API report
        run: node scripts/generate-report.js api_test_results.json artifacts/api-test-report.xlsx

      - name: Upload API report artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: artifacts/api-test-report.xlsx
